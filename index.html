<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baissez les dépenses — simulateur sourcé</title>
<meta name="description" content="Choisissez quelles dépenses publiques baisser. Chaque mesure est chiffrée, sourcée, avec ses obstacles juridiques et européens.">
<meta property="og:title" content="Baissez les dépenses — simulateur sourcé">
<meta property="og:description" content="Faites votre budget. Chaque curseur affiche sources, arguments et obstacles juridiques.">
<meta property="og:image" content="https://matthieugariel.github.io/baissez-les-depenses/og.png">
<meta property="og:url" content="https://matthieugariel.github.io/baissez-les-depenses/">
<meta name="twitter:card" content="summary_large_image">
<link rel="alternate" type="application/json" href="data/postes.json">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Baissez les dépenses</h1>
  <p class="sub">Dépenses publiques (APU) : <strong id="total"></strong> · Déficit : <strong id="deficit"></strong></p>
  <div class="score">
    <div><span id="eco">0</span> Md€ économisés</div>
    <div id="pct" class="muted"></div>
    <div id="risk" class="muted"></div>
    <button id="share">Partager mon budget</button>
  </div>
  <div class="stack" id="stack" role="img" aria-label="Contribution de chaque poste au déficit comblé"></div>
  <p class="muted stackinfo" id="stackinfo" aria-live="polite"></p>
  <p class="muted" id="interets"></p>
  <div class="tax"><span id="taxline"></span><div class="bar"><div id="taxfill"></div></div></div>
  <p class="muted" id="taxtxt"></p>
  <p class="warn" id="statut"></p>
</header>
<main id="postes"></main>
<footer>
  Données ouvertes : <a href="data/postes.json">postes.json</a> · <a href="llms.txt">llms.txt</a> · <a href="https://github.com/MatthieuGariel/baissez-les-depenses/issues/new" target="_blank" rel="noopener">Signaler une erreur</a> · Licence CC BY 4.0
<p class="warn" id="statut2"></p>
</footer>
<dialog id="preview">
  <h2>Aperçu de mon budget</h2>
  <img id="previewimg" alt="Image de mon scénario de budget">
  <div class="actions"><button id="doshare">Partager / Télécharger</button><button id="close" class="sec">Fermer</button></div>
</dialog>
<script src="app.js"></script>
</body>
</html>
